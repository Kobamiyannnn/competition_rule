name: ci

on:
  # PR では pull_request だけで回す。push でも回すと同じコミットで二重に走る。
  push:
    branches: [main]
  pull_request:

# 同じブランチに続けてプッシュしたら、古い実行を打ち切る。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # uv が唯一の入り口。pip でのフォールバックは用意しない。
      # 用意すると「uv が無い環境でだけ挙動が違う」状態が生まれ、
      # 再現性を土台にしているこの基盤では、その状態自体が害になる。
      - name: uv を入れる
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 依存を入れる
        run: uv sync --locked

      - name: pyflakes
        run: uv run pyflakes tools/expkit tools/hooks templates

      - name: テスト
        run: uv run pytest -q

      # 規範の文書と実装がずれていないかを、テストとは別に明示して回す。
      # ここが落ちるときは、スキルの例文が linter に落ちる状態になっている。
      - name: スキルの例文と linter の一致
        run: uv run pytest tools/tests/test_skill_examples.py -q

      # テンプレート同梱の設定ファイルが壊れていないか。
      - name: 同梱の設定が読めるか
        run: |
          uv run python - <<'PY'
          import os
          os.environ["EXPKIT_ROOT"] = "."
          from expkit.config import load_competition, load_lint_config
          from expkit.state import load_state

          cfg = load_lint_config()
          assert cfg["vocab"], "語彙規則が空"
          assert cfg["limits"], "字数上限が空"
          comp = load_competition()
          assert comp.get("phases"), "phase が定義されていない"
          state = load_state()
          assert len(state.axis_ids) >= 10, f"軸が少なすぎる: {len(state.axis_ids)}"
          print(f"ok: 語彙 {sum(len(v['patterns']) for v in cfg['vocab'].values())} パターン / "
                f"軸 {len(state.axis_ids)} 本")
          PY

      - name: expctl が起動するか
        run: uv run expctl --help > /dev/null && echo "ok"

      - name: シェルスクリプトの構文
        run: bash -n tools/bootstrap.sh && bash -n tools/githooks/pre-push

      # コンペで使い始めたリポジトリでは、記録そのものも CI で検査する。
      # hook を迂回して書かれた記録をここで捕まえる。
      - name: 記録の検査（初期化済みのリポジトリのみ）
        run: |
          name=$(uv run python -c "import yaml;print((yaml.safe_load(open('competition.yaml')) or {}).get('name',''))")
          if [ "$name" = "TODO" ] || [ -z "$name" ]; then
            echo "テンプレートのまま（name=$name）。記録の検査は飛ばす。"
          else
            uv run expctl lint
          fi

      # hook が JSON を受けて期待どおりの終了コードを返すか。
      - name: hook の挙動
        run: |
          set -e
          run_hook() {
            echo "$2" | python3 "$1" >/dev/null 2>&1 && echo 0 || echo $?
          }
          test "$(run_hook tools/hooks/guard.py \
            '{"hook_event_name":"PreToolUse","tool_input":{"file_path":"'"$PWD"'/experiments/exp0001/metrics.json"}}')" = 2
          test "$(run_hook tools/hooks/guard.py \
            '{"hook_event_name":"PreToolUse","tool_input":{"file_path":"'"$PWD"'/src/train.py"}}')" = 0
          test "$(run_hook tools/hooks/session.py \
            '{"hook_event_name":"SessionStart","source":"startup","cwd":"'"$PWD"'"}')" = 0
          test "$(run_hook tools/hooks/stop.py \
            '{"hook_event_name":"Stop","stop_hook_active":false,"cwd":"'"$PWD"'"}')" = 0
          echo "ok: hook の終了コードは期待どおり"
