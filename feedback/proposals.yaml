# competition_rule そのものへの改善提案。
#
# 実験の記録ではなく、**この基盤に足りなかったもの**を残す場所。
# `uv run expctl feedback` がここを読んで、テンプレートリポジトリ宛の
# 報告にまとめる。
#
# 提案は必ず**実際に起きた出来事に紐づける**。
# 「あると便利」は願望で、再設計の材料にならない。
# 「exp0012 でこうしたかったが置き場所がなく、こう回避した」は不具合報告になる。
# だから `at` に実験か決定の ID が必須で、空だと検証に落ちる。
#
# 書くきっかけ:
#   - ゲートを --force で押し切ったとき（基盤が判断を邪魔した）
#   - lint_waived を使ったとき（規則がその場では間違っていた）
#   - 記録したいことに置き場所が無かったとき
#   - 規範に従うと不自然な作業になったとき
#
# 追加は `uv run expctl propose`。入れる前に検証がかかる。

proposals: []
# - id: p0001
#   created_at: 2026-09-08T12:00:00+09:00
#   kind: missing_capability   # missing_capability / wrong_default /
#                              # unclear_norm / friction / bug
#   at: [exp0012]              # 起きた実験か決定。必須。ここが空なら願望であって提案ではない
#   incident: |
#     何が起きたか。事実として書く。
#     例: exp0012 で fold ごとに別のモデルを使う構成を試したが、
#         config が1モデル前提で、diff に差分を表現できなかった。
#   missing: |
#     何が無かったのか。基盤の側の欠落として書く。
#   workaround: |
#     どう回避したか。回避できたなら書く。できなかったなら「できなかった」と書く。
#     回避できたかどうかで、その欠落の深刻さが変わる。
#   status: open               # open / filed / wontfix
#   filed_as: null             # Issue の URL（投げたあとに書く）
